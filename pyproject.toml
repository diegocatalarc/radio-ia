[project]
name = "radio-ia"
version = "0.1.0"
description = "Podcast diario en español sobre IA y su impacto económico"
requires-python = ">=3.11"
dependencies = [
    "feedparser",
    "httpx",
    "trafilatura",
    "anthropic",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
