# Zona horaria del oyente: define "hoy" y la fecha de cada episodio.
# Si la cambias, recalcula también el cron de .github/workflows/daily.yml (ver README).
timezone = "America/Santiago"
# Solo es el respaldo de la fecha de publicación (pubDate) si un episodio no la trae.
# Los episodios nuevos usan su hora real de generación. 2 = 02:00, hora del cron.
publish_hour = 2
# Proveedor del LLM: "deepseek" (API directa, usa DEEPSEEK_API_KEY), "openrouter" (OPENROUTER_API_KEY)
# o "anthropic" (ANTHROPIC_API_KEY, requiere: pip install '.[anthropic]').
llm_provider = "deepseek"
# `model` escribe el guion (la tarea exigente: no inventar cifras, citar fuentes); `select_model`
# elige las historias leyendo solo titulares (tarea simple, llamada barata). Vacío = usa `model`.
# DeepSeek: "deepseek-v4-pro" (el más capaz) y "deepseek-flash" (el más barato).
# OpenRouter: ids como "anthropic/claude-sonnet-5.5"; Anthropic: "claude-sonnet-5-5".
model = "deepseek-v4-pro"
select_model = "deepseek-flash"
max_stories = 6
# Historias candidatas que ve Claude al elegir (reparto equilibrado entre fuentes).
pool_size = 30
# IMPORTANTE: reemplaza por https://<tu-usuario-de-github>.github.io/<nombre-del-repo>
# (sin barra final). El feed usa esta URL para los enlaces a los MP3.
site_url = "https://diegocatalarc.github.io/radio-ia"
# Voz: "openrouter" (por defecto, OPENROUTER_API_KEY), "openai" (OPENAI_API_KEY) o "elevenlabs".
tts_provider = "openrouter"
# Modelo de voz de OpenRouter (vacío = microsoft/mai-voice-2.1-flash). Ver las voces de cada modelo en
# https://openrouter.ai/api/v1/models?output_modalities=speech (campo supported_voices).
tts_model = ""
# Vacío = es-MX-Valeria:MAI-Voice-2.1-Flash con el modelo por defecto. Escucha las muestras antes de fiarte.
tts_voice = ""
# Entrada escrita del día (una noticia en profundidad). Solo se alimenta de historias de estos
# medios, con redacción y estándares editoriales propios: no entran blogs corporativos (OpenAI,
# DeepMind), que son la parte interesada, ni agregadores. Lista vacía = no se escribe entrada.
# Se aceptan subdominios (p. ej. "feeds.bloomberg.com" vale por "bloomberg.com").
trusted_domains = [
    "bloomberg.com",
    "economist.com",
    "theguardian.com",
    "technologyreview.com",
    "cnbc.com",
    "wired.com",
    "theverge.com",
    "techcrunch.com",
    "fastcompany.com",
]
# Modelo de la entrada escrita (vacío = el mismo que `model`).
article_model = ""

feeds = [
    "https://techcrunch.com/category/artificial-intelligence/feed/",
    "https://www.technologyreview.com/topic/artificial-intelligence/feed",
    "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml",
    "https://www.wired.com/feed/tag/ai/latest/rss",
    "https://www.cnbc.com/id/19854910/device/rss/rss.html",
    "https://www.theguardian.com/technology/artificialintelligenceai/rss",
    "https://www.fastcompany.com/technology/rss",
    "https://www.xataka.com/tag/inteligencia-artificial/rss2.xml",
    "https://feeds.bloomberg.com/technology/news.rss",
    "https://openai.com/news/rss.xml",
    "https://deepmind.google/blog/rss.xml",
    "https://www.economist.com/science-and-technology/rss.xml",
]
