# Zona horaria del oyente: define "hoy" y la fecha de cada episodio.
# Si la cambias, recalcula también el cron de .github/workflows/daily.yml (ver README).
timezone = "America/Santiago"
# Solo es el respaldo de la fecha de publicación (pubDate) si un episodio no la trae.
# Los episodios nuevos usan su hora real de generación. 2 = 02:00, hora del cron.
publish_hour = 2
model = "claude-sonnet-5-5"
max_stories = 6
# Historias candidatas que ve Claude al elegir (reparto equilibrado entre fuentes).
pool_size = 30
# IMPORTANTE: reemplaza por https://<tu-usuario-de-github>.github.io/<nombre-del-repo>
# (sin barra final). El feed usa esta URL para los enlaces a los MP3.
site_url = "https://example.github.io/radio-ia"
tts_provider = "openai"
tts_voice = ""

feeds = [
    "https://techcrunch.com/category/artificial-intelligence/feed/",
    "https://www.technologyreview.com/topic/artificial-intelligence/feed",
    "https://venturebeat.com/category/ai/feed/",
    "https://feeds.bloomberg.com/technology/news.rss",
    "https://openai.com/news/rss.xml",
    "https://www.anthropic.com/rss.xml",
    "https://deepmind.google/blog/rss.xml",
    "https://www.economist.com/science-and-technology/rss.xml",
]
