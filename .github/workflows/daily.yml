name: Episodio diario

on:
  schedule:
    # Principal: 05:17 UTC = 02:17 en Chile con horario de verano (UTC-3). El minuto 17 evita
    # la congestión de las horas en punto, donde GitHub retrasa o descarta ejecuciones.
    - cron: "17 5 * * *"
    # Respaldo: una hora después. Toda ejecución programada no hace nada si el episodio de hoy ya existe.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      check_feeds:
        description: "Solo diagnosticar los feeds (scripts/check_feeds.py) y terminar sin generar"
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez (la segunda espera a que termine la primera).
concurrency:
  group: radio-ia-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el proyecto
        run: pip install .

      - name: Diagnóstico de feeds (solo si check_feeds=true)
        id: feeds
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_feeds }}" = "true" ]; then
            python scripts/check_feeds.py
            echo "only=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Solo diagnóstico::Feeds comprobados; no se genera episodio."
          else
            echo "only=false" >> "$GITHUB_OUTPUT"
          fi

      # Los datos (site/ + state.json) viven en la rama gh-pages, que es también
      # la que publica GitHub Pages. Se clona dentro de site/.
      - name: Recuperar datos previos (rama gh-pages)
        if: steps.feeds.outputs.only != 'true'
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$repo_url" site
          else
            mkdir site
            git -C site init --quiet --initial-branch=gh-pages
            git -C site remote add origin "$repo_url"
          fi
          touch site/.nojekyll
          if [ -f site/state.json ]; then cp site/state.json state.json; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar si hoy ya hay episodio (solo respaldo)
        id: guard
        if: steps.feeds.outputs.only != 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python -m radio.check; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ya publicado::El episodio de hoy ya existe; no se hace nada."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar episodio
        id: run
        if: steps.feeds.outputs.only != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          set +e
          python -m radio.run
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            # Un día sin episodio no puede pasar en silencio: el correo de "run failed" de
            # GitHub es el aviso.
            echo "::error title=Sin episodio hoy::no episode today: fewer than 2 stories (menos de 2 historias relevantes); no se publicó nada. Revisa los feeds (scripts/check_feeds.py)."
            exit 2
          fi
          exit "$code"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Publicar en gh-pages
        if: steps.feeds.outputs.only != 'true' && steps.guard.outputs.skip != 'true' && steps.run.outputs.code == '0'
        run: |
          set -euo pipefail
          python -m radio.check --prune
          cp state.json site/state.json
          cd site
          git config user.name "radio-ia[bot]"
          git config user.email "radio-ia-bot@users.noreply.github.com"
          # Un único commit huérfano por día, forzado a gh-pages: el historial no crece.
          git checkout --quiet --orphan publish
          git add -A
          git commit --quiet -m "Episodio $(date -u +%F)"
          git push --force origin publish:gh-pages
