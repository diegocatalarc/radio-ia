name: Video semanal

on:
  schedule:
    # Domingo 09:17 UTC (≈06:17 en Chile con horario de verano), después de los dos intentos del diario
    # (05:17 y 06:17 UTC). El minuto 17 evita la congestión de las horas en punto.
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerar el video aunque esta semana ya esté publicado"
        type: boolean
        default: false

# Misma cola que el diario: ambos hacen push forzado a gh-pages y nunca deben solaparse.
concurrency:
  group: radio-ia-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Instalar el proyecto
        run: pip install .

      - name: Instalar Remotion y su navegador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0t64 \
            libpango-1.0-0 libcairo2 libcups2t64
          npm --prefix video ci --no-audit --no-fund
          cd video && npx remotion browser ensure

      # Los datos (site/: days/, weekly/, episodes...) viven en la rama gh-pages. Se clona en site/.
      - name: Recuperar datos previos (rama gh-pages)
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch gh-pages "$repo_url" site
          touch site/.nojekyll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar video semanal
        id: weekly
        run: |
          set +e
          # La ejecución programada del domingo siempre regenera (--force): si alguien lanzó el flujo a
          # mano entre semana, esa semana ya figura publicada y sin --force el domingo no haría nada.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" = "true" ]; then
            python -m radio.weekly --force
          else
            python -m radio.weekly
          fi
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::notice title=Sin video semanal::Menos de 4 días de registros diarios; no se publicó nada."
            exit 0
          fi
          exit "$code"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Opcionales: solo si cambias llm_provider / tts_provider en config.toml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Publicar en gh-pages
        if: steps.weekly.outputs.code == '0'
        run: |
          set -euo pipefail
          cp web/index.html site/index.html
          cd site
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice title=Sin cambios::Nada que publicar."
            exit 0
          fi
          git config user.name "radio-ia[bot]"
          git config user.email "radio-ia-bot@users.noreply.github.com"
          # Un único commit huérfano, forzado a gh-pages: el historial no crece.
          git checkout --quiet --orphan publish
          git add -A
          git commit --quiet -m "Video semanal $(date -u +%F)"
          git push --force origin publish:gh-pages
